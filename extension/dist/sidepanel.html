<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veil Side Panel</title>
  <style>:root{--bg:#07090f;--card:#0f1624eb;--border:#94a3b82e;--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8;--ok:#34d399;--warn:#fbbf24;--err:#fb7185}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);margin:0;padding:14px;font:13px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}.hdr{justify-content:space-between;align-items:center;margin-bottom:10px;display:flex}.hdr h1{letter-spacing:-.01em;margin:0;font-size:16px}.pill{color:var(--accent);background:#38bdf824;border:1px solid #38bdf84d;border-radius:999px;padding:3px 8px;font-size:11px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:12px}textarea{width:100%;min-height:110px;color:var(--text);border:1px solid var(--border);resize:vertical;background:#04060b;border-radius:8px;padding:9px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.row{flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;display:flex}select,button{border:1px solid var(--border);color:var(--text);cursor:pointer;background:#0f172a;border-radius:8px;padding:7px 10px;font-size:12.5px}button.primary{color:#fff;background:linear-gradient(135deg,#0284c7,#0ea5e9);border-color:#38bdf8;flex:1;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}.meta{color:var(--muted);margin-top:6px;font-size:11.5px}.mono-box{border:1px solid var(--border);white-space:pre-wrap;word-break:break-word;background:#04060b;border-radius:8px;max-height:180px;padding:9px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-y:auto}.status-ok{color:var(--ok);font-weight:600}.status-warn{color:var(--warn);font-weight:600}.tok{color:#7dd3fc;background:#38bdf829;border:1px solid #38bdf859;border-radius:4px;padding:1px 5px;font-weight:600;display:inline-block}.rest{color:#6ee7b7;background:#34d39929;border:1px solid #34d39959;border-radius:4px;padding:0 4px;display:inline-block}label.chk{color:var(--muted);cursor:pointer;align-items:center;gap:6px;font-size:12px;display:flex}</style>
  <script type="module" crossorigin src="./assets/sidepanel-D_vghRU2.js"></script>
</head>
<body>
  <div class="hdr">
    <h1>Veil Extension</h1>
    <span class="pill" id="extBadge">On-Device First</span>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0; margin-bottom:8px;">
      <button type="button" id="grabTabBtn">Grab Page Selection</button>
      <button type="button" id="presetBtn">Load Finance Preset</button>
    </div>
    <textarea id="extInput" placeholder="Select text on any page and right-click -> Mask & Ask Veil, or paste sensitive text here..."></textarea>
    <div class="row">
      <select id="extTask">
        <option value="reply">Draft a reply</option>
        <option value="summary">Summarize</option>
        <option value="actions">Extract action items</option>
        <option value="formal">Make it formal</option>
        <option value="arabic">Translate to Arabic</option>
      </select>
      <label class="chk"><input type="checkbox" id="extLocalOnly" /> Keep local</label>
    </div>
    <div class="row">
      <button type="button" id="extRunBtn" class="primary">Mask On-Device &amp; Run</button>
      <button type="button" id="extApproveCloudBtn" hidden>Approve Rules-Only Cloud</button>
    </div>
    <div class="meta" id="extStatus">Ready. Zero text leaves your browser unmasked.</div>
  </div>

  <div class="card">
    <div class="meta" style="margin-top:0; margin-bottom:4px;">Outbound Cloud Payload (Leak Guard Verified)</div>
    <div class="mono-box" id="extCloudSaw">Waiting for scan...</div>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0; justify-content:space-between; margin-bottom:4px;">
      <span class="meta" style="margin:0;">Restored Output (Unmasked Locally)</span>
      <button type="button" id="extCopyBtn" disabled>Copy</button>
    </div>
    <div class="mono-box" id="extOut">Run Veil to draft on masked placeholders and restore real values locally.</div>
  </div>

</body>
</html>
