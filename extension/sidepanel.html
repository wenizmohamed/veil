<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veil Side Panel</title>
  <style>
    :root {
      --bg: #07090f;
      --card: rgba(15, 22, 36, 0.92);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px; background: var(--bg); color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .hdr h1 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }
    .pill {
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: rgba(56, 189, 248, 0.14); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-bottom: 10px;
    }
    textarea {
      width: 100%; min-height: 110px; background: #04060b; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 9px; resize: vertical;
      font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
    select, button {
      border-radius: 8px; border: 1px solid var(--border); padding: 7px 10px;
      background: #0f172a; color: var(--text); font-size: 12.5px; cursor: pointer;
    }
    button.primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9); border-color: #38bdf8;
      font-weight: 600; color: #fff; flex: 1;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
    .mono-box {
      background: #04060b; border: 1px solid var(--border); border-radius: 8px;
      padding: 9px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto;
    }
    .status-ok { color: var(--ok); font-weight: 600; }
    .status-warn { color: var(--warn); font-weight: 600; }
    .tok {
      display: inline-block; padding: 1px 5px; border-radius: 4px; font-weight: 600;
      background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .rest {
      display: inline-block; padding: 0 4px; border-radius: 4px;
      background: rgba(52, 211, 153, 0.16); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.35);
    }
    label.chk { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; }
  </style>
</head>
<body>
  <div class="hdr">
    <h1>Veil Extension</h1>
    <span class="pill" id="extBadge">On-Device First</span>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0; margin-bottom:8px;">
      <button type="button" id="grabTabBtn">Grab Page Selection</button>
      <button type="button" id="presetBtn">Load Finance Preset</button>
    </div>
    <textarea id="extInput" placeholder="Select text on any page and right-click -> Mask & Ask Veil, or paste sensitive text here..."></textarea>
    <div class="row">
      <select id="extTask">
        <option value="reply">Draft a reply</option>
        <option value="summary">Summarize</option>
        <option value="actions">Extract action items</option>
        <option value="formal">Make it formal</option>
        <option value="arabic">Translate to Arabic</option>
      </select>
      <label class="chk"><input type="checkbox" id="extLocalOnly" /> Keep local</label>
    </div>
    <div class="row">
      <button type="button" id="extRunBtn" class="primary">Mask On-Device &amp; Run</button>
      <button type="button" id="extApproveCloudBtn" hidden>Approve Rules-Only Cloud</button>
    </div>
    <div class="meta" id="extStatus">Ready. Zero text leaves your browser unmasked.</div>
  </div>

  <div class="card">
    <div class="meta" style="margin-top:0; margin-bottom:4px;">Outbound Cloud Payload (Leak Guard Verified)</div>
    <div class="mono-box" id="extCloudSaw">Waiting for scan...</div>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0; justify-content:space-between; margin-bottom:4px;">
      <span class="meta" style="margin:0;">Restored Output (Unmasked Locally)</span>
      <button type="button" id="extCopyBtn" disabled>Copy</button>
    </div>
    <div class="mono-box" id="extOut">Run Veil to draft on masked placeholders and restore real values locally.</div>
  </div>

  <script type="module" src="./sidepanel.js"></script>
</body>
</html>
